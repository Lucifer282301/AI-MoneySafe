workflows:
  ios-simulator:
    name: AI-MoneySafe iOS Simulator

    max_build_duration: 120

    instance_type: mac_mini_m2

    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          cd "$CM_BUILD_DIR/mobile"
          npm ci

      - name: Install CocoaPods dependencies
        script: |
          cd "$CM_BUILD_DIR/mobile/ios"
          pod install

      - name: Build iOS Simulator app
        script: |
          xcodebuild \
            -workspace "$CM_BUILD_DIR/mobile/ios/mobile.xcworkspace" \
            -scheme mobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - $CM_BUILD_DIR/build/ios/Build/Products/Debug-iphonesimulator/*.app