workflows:
  ios-release:
    name: iOS release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: 22
      cocoapods: default
      vars:
        ENABLE_PUSH: "1"
        USE_FRAMEWORKS: "static"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourname.moneysafe
    integrations:
      app_store_connect: moneysafe-asc
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Configure the iOS project (Firebase file and push entitlement)
        script: |
          gem install xcodeproj --no-document
          ruby scripts/ios_configure.rb
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Set the build number
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/MoneySafeApp/Info.plist
      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/MoneySafeApp.xcworkspace" \
            --scheme "MoneySafeApp"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
