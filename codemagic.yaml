workflows:
  ios-build:
    name: AI-MoneySafe iOS Build

    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Build iOS app
        script: |
          xcodebuild \
            -workspace ios/mobile.xcworkspace \
            -scheme mobile \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/MoneySafe.xcarchive \
            archive

    artifacts:
      - $CM_BUILD_DIR/MoneySafe.xcarchive