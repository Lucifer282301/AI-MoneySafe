workflows:
  android-debug:
    name: AI-MoneySafe Android Debug
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22.11.0
      java: 17
    scripts:
      - name: Install npm dependencies
        script: |
          cd "$CM_BUILD_DIR/mobile"
          npm ci
      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/mobile/android/local.properties"
      - name: Build Android debug APK
        script: |
          cd "$CM_BUILD_DIR/mobile/android"
          bash ./gradlew assembleDebug
    artifacts:
      - $CM_BUILD_DIR/mobile/android/app/build/outputs/apk/debug/*.apk

  ios-build:
    name: AI-MoneySafe iOS Build

    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Build iOS app
        script: |
          xcodebuild \
            -workspace ios/mobile.xcworkspace \
            -scheme mobile \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/MoneySafe.xcarchive \
            archive

    artifacts:
      - $CM_BUILD_DIR/MoneySafe.xcarchive