services:
  api:
    build: .
    ports:
      - "4000:4000"
    env_file: .env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moneysafe
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: moneysafe
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
